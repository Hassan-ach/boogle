# MkDocs + Material configuration for the Boogle documentation.
#
# Service-owned pages under services/<service>/docs/ are copied into
# docs/services/<service>/ by scripts/docs.py before every build. See
# docs/development/documentation.md for the full workflow.

site_name: Boogle Documentation
site_description: Technical documentation for the Boogle distributed search engine.
repo_url: https://github.com/Hassan-ach/boogle
repo_name: Hassan-ach/boogle
edit_uri: edit/main/
docs_dir: docs
site_dir: site
use_directory_urls: true
# Historical docs remain in the repository for provenance, but the new site is
# the authoritative generated documentation. Keep them out of the MkDocs tree so
# strict builds do not surface stale pages as "not in nav".
exclude_docs: |
  ARCHITECTURE.md
  ENGINE.md
  INDEXER.md
  RANKING.md
  SPIDER.md
  Notes.md

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: ignore

hooks:
  - docs/hooks.py

nav:
  - Home: index.md
  - Getting started:
      - Prerequisites: getting-started/prerequisites.md
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
      - Quick start: getting-started/quick-start.md
  - Architecture:
      - Overview: architecture/overview.md
      - System design: architecture/system-design.md
      - Services: architecture/services.md
      - Communication: architecture/communication.md
      - Data flow: architecture/data-flow.md
      - Infrastructure: architecture/infrastructure.md
  - Services:
      - Spider:
          - Overview: services/spider/index.md
          - Architecture: services/spider/architecture.md
          - Implementation: services/spider/implementation.md
          - Configuration: services/spider/configuration.md
      - Engine:
          - Overview: services/engine/index.md
          - Architecture: services/engine/architecture.md
          - HTTP interface: services/engine/api.md
          - Implementation: services/engine/implementation.md
          - Configuration: services/engine/configuration.md
      - Indexer:
          - Overview: services/indexer/index.md
          - Architecture: services/indexer/architecture.md
          - Indexing pipeline: services/indexer/indexing-pipeline.md
          - Configuration: services/indexer/configuration.md
      - Ranking:
          - Overview: services/ranking/index.md
          - Architecture: services/ranking/architecture.md
          - Algorithms: services/ranking/algorithms.md
          - Database functions: services/ranking/database-functions.md
          - Configuration: services/ranking/configuration.md
  - Data:
      - Database overview: data/database.md
      - Schema: data/schema.md
      - Migrations: data/migrations.md
      - Message contracts: data/message-contracts.md
  - Operations:
      - Docker Compose: operations/docker.md
      - Deployment: operations/deployment.md
      - Monitoring: operations/monitoring.md
      - Logging: operations/logging.md
      - Troubleshooting: operations/troubleshooting.md
  - Development:
      - Environment setup: development/setup.md
      - Project structure: development/project-structure.md
      - Testing: development/testing.md
      - Coding conventions: development/coding-conventions.md
      - Contributing: development/contributing.md
      - Documentation: development/documentation.md
  - Reference:
      - Environment variables: reference/environment-variables.md
      - Commands: reference/commands.md
      - Dependencies: reference/dependencies.md
      - Known issues: reference/known-issues.md
