[package]
name = "indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
html5ever = "0.35.0"
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
uuid = { version = "1", features = ["serde", "v4"] }
dotenv = "0.15"
anyhow = { version = "1.0", default-features = false }
tokio-util = { version = "0.7", features = ["rt"] }
slog = "2.8.2"
slog-json = "2.6.1"
slog-async = "2.8.0"
slog-term = "2.9.2"
lapin = "4.12.0"
tokio-stream = "0.1.19"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
async-trait = "0.1.92"
thiserror = "2.0.21"

[dev-dependencies]
# `full` does not include `test-util`, which `#[tokio::test(start_paused)]` needs.
tokio = { version = "1.0", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
