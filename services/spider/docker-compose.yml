services:
  spider:
    build: .
    container_name: spider
    restart: unless-stopped
    env_file:
      # Container addresses and credentials, generated by `just env` from the
      # root .env. Optional so a bare compose invocation still uses .env alone.
      - path: .env
        required: false
      - path: .env.docker
        required: false
    networks:
      - search_net
networks:
  search_net:
    external: true
    name: search_net
