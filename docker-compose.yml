services:
  psql:
    image: postgres:18.6-alpine3.24
    container_name: psql
    restart: unless-stopped
    volumes:
      - ./migration:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DBNAME}
    ports:
      # Loopback only: the database is reachable to the services on
      # search_net and to an operator on the host, never from the internet.
      - "127.0.0.1:${PG_PORT}:5432"
    networks:
      - search_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine3.23
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    networks:
      - search_net
    healthcheck:
      test:
        ["CMD-SHELL", 'redis-cli -a "$${REDISCLI_AUTH}" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    networks:
      - search_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  adminer:
    image: adminer:5
    container_name: adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - search_net
    depends_on:
      psql:
        condition: service_healthy

volumes:
  pgdata:

networks:
  # A fixed name so each service's own compose file can attach to it as an
  # external network.
  search_net:
    name: search_net
